{% extends 'foundation/base.html' %}{% block content %}<h1>{{ title }}</h1><p>Căn cứ: {{ source }}</p><p>{{ rows|length }} dòng. Chưa được ghi vào danh mục.</p><section class='panel table-wrap'><table><thead><tr>{% for h in headers %}<th>{{ h }}</th>{% endfor %}</tr></thead><tbody>{% for row in rows %}<tr>{% for v in row %}<td>{{ v }}</td>{% endfor %}</tr>{% endfor %}</tbody></table></section><form method='post'>{% csrf_token %}<input type="hidden" name="form_workspace" value="{{ workspace.ma_dinh_danh }}"><input type='hidden' name='preview_token' value='{{ token }}'><button class='primary'>Xác nhận nhập tất cả dòng</button></form>{% endblock %}
