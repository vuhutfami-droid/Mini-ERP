const query=$('#filter').value.toLocaleLowerCase('vi');rows=rows.filter(r=>r.join(' ').toLocaleLowerCase('vi').includes(query));$('tbody').innerHTML=rows.map(r=>'<tr>'+r.map((v,i)=>`<td>${i===0&&current.slug==='orders'?`<a href="${v==='SO-N-001'?'#order':'#delivery'}">${esc(v)}</a>`:esc(v)}</td>`).join('')+'</tr>').join('');$('#count').textContent=rows.length+' dòng';$('#empty').hidden=rows.length!==0;}
function openForm(){opener=document.activeElement;$('#dialogtitle').textContent='Biểu mẫu · '+current.title;$('.fields').innerHTML=current.form.map((f,i)=>`<label for="field${i}">${esc(f)}<input id="field${i}" name="field${i}" placeholder="Nhập để xem bố cục"></label>`).join('');$('#result').hidden=true;$('#dialog').showModal();}
function closeForm(){$('#dialog').close();if(opener)opener.focus()}
$('#close').onclick=closeForm;$('#cancel').onclick=closeForm;$('#dialog').addEventListener('cancel',()=>{if(opener)setTimeout(()=>opener.focus(),0)});$('#form').onsubmit=e=>{e.preventDefault();$('#result').textContent=current.guard+' Đây là mô tả điều kiện; chưa kiểm tra hay lưu các giá trị vừa nhập.';$('#result').hidden=false};$('.mobiletoggle').onclick=()=>{$('#sidebar').classList.toggle('open');$('.mobiletoggle').setAttribute('aria-expanded',String($('#sidebar').classList.contains('open')))};$('#role').onchange=render;window.addEventListener('hashchange',render);render();
</script></html>
